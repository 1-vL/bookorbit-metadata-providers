# Builds one provider's image and pushes it to GHCR when its release tag is pushed:
# `mangabaka-v0.2.0` publishes ghcr.io/<owner>/mangabaka-provider as 0.2.0, 0.2 and latest.
# Each architecture builds on its own native runner, because compiling arm64 under emulation takes
# over half an hour; the merge job then joins the two into one multi-arch tag.
name: Publish provider image

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.release.outputs.provider }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - name: Read the provider and version from the tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          provider="${TAG%%-v*}"
          version="${TAG#*-v}"
          case "$version" in
            *[!0-9.]* | "" ) echo "::error::tag $TAG is not <provider>-v<major.minor.patch>"; exit 1 ;;
          esac
          {
            echo "provider=$provider"
            echo "version=$version"
            echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$provider-provider"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Check the provider exists
        env:
          PROVIDER: ${{ steps.release.outputs.provider }}
        run: test -f "providers/$PROVIDER/Dockerfile" || { echo "::error::no providers/$PROVIDER/Dockerfile"; exit 1; }

  build:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged, by digest only; the merge job tags it.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: providers/${{ needs.release.outputs.provider }}
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ needs.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
