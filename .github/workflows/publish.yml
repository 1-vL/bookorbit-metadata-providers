# Builds one provider's image for amd64 and arm64 and pushes it to GHCR when its release tag is
# pushed: `mangabaka-v0.2.0` publishes ghcr.io/<owner>/mangabaka-provider as 0.2.0, 0.2 and latest.
name: Publish provider image

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read the provider and version from the tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          provider="${TAG%%-v*}"
          version="${TAG#*-v}"
          case "$version" in
            *[!0-9.]* | "" ) echo "::error::tag $TAG is not <provider>-v<major.minor.patch>"; exit 1 ;;
          esac
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$provider-provider"
          {
            echo "provider=$provider"
            echo "tags=$image:$version,$image:${version%.*},$image:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Check the provider exists
        env:
          PROVIDER: ${{ steps.release.outputs.provider }}
        run: test -f "providers/$PROVIDER/Dockerfile" || { echo "::error::no providers/$PROVIDER/Dockerfile"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: providers/${{ steps.release.outputs.provider }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
