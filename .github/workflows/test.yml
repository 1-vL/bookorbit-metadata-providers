name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check; pushes to main each get their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every Rust crate is tested without being listed here, so adding a provider never touches this file.
  rust-dirs:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          dirs=$(for f in providers/*/Cargo.toml starters/*/Cargo.toml; do dirname "$f"; done | jq -Rnc '[inputs]')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  rust:
    needs: rust-dirs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.rust-dirs.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      # Test with the compiler the image is built with, so a new Rust release cannot fail a crate
      # nobody touched.
      - name: Read the Rust version from the Dockerfile
        id: rust
        run: |
          version=$(sed -n 's/^FROM rust:\([0-9.]*\).*/\1/p' Dockerfile | head -n 1)
          test -n "$version" || { echo "::error::Dockerfile has no FROM rust:<version> line"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [starters/go, conformance]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BookOrbit reads directory.json to list the providers an admin can install.
      - name: Check directory.json lists every provider, with the fields BookOrbit needs
        run: |
          jq -e '.providers | length > 0' directory.json > /dev/null
          jq -e '.providers | all(.key and .name and .summary and .image and .version and .docsUrl)' directory.json > /dev/null
          for dir in providers/*/; do
            key=$(basename "$dir")
            jq -e --arg key "$key" 'any(.providers[]; .key == $key)' directory.json > /dev/null \
              || { echo "::error::providers/$key is missing from directory.json"; exit 1; }
          done
