<!DOCTYPE html><html lang="ru"><head><title>Ночной Дозор</title></head><body><script>self.__next_f.push([1,"30:T172b,{\"type\":\"next\",\"value\":{\"data\":{\"oldBook\":{\"book\":{\"linked_audiobook_uuids\":[\"yolWzcli\"],\"editor_annotation\":\"И треснул мир напополам: первый роман серии о противостоянии светлых и тёмных Иных\",\"annotation\":\"Пять лет назад Антон Городецкий узнал, что он – светлый Иной. То есть может входить в Сумрак и делать то, что обычные люди считают волшебством. Антон решил работать в Ночном Дозоре, чтобы сохранять баланс сил между Светом и Тьмой – оборотнями, вампирами, ведьмами.\\r\\n\\r\\nНо поскольку Городецкий засиделся в аналитическом отделе, Борис Гесер, руководитель московского отделения Дозоров, отправляет мужчину в поле – на охоту за вампиром-маньяком.\\r\\n\\r\\nИ тут начинает твориться что-то невероятное… Выслеживая мальчика, на которого направлен вампирский Зов, Антон встречает в метро девушку с черной воронкой проклятия невероятного масштаба. Городецкий должен бы проследить за девушкой, но он наконец-то обнаруживает мальчика, которого так долго искал. И отправляется за ним, чтобы спасти от вампиров…\\r\\n\\r\\nОхота заканчивается не так, как планировалось. А вскоре Антон узнает: воронка над девушкой может уничтожить Москву. Чтобы не допустить прорыв инферно, Иным надо как можно быстрее выяснить, кто же наложил проклятие такой мощности. А тем временем неупокоенная вампирша продолжает охотиться на спасенного мальчика, который может стать Великим Иным…\",\"authors\":\"Сергей Лукьяненко\",\"language\":\"ru\",\"paper_pages\":405,\"restricted_reading_on_web\":false,\"title\":\"Ночной Дозор\",\"uuid\":\"FVvJyn5e\",\"init_uuid\":\"FVvJyn5e\",\"type\":\"book\",\"source_type\":\"html\",\"publication_date\":1670965200,\"owner_catalog_title\":\"АСТ\",\"original_year\":null,\"is_uploaded\":false,\"episodes_count\":null,\"bookshelves_count\":309,\"impressions_count\":2052,\"quotes_count\":9963,\"readers_count\":52133,\"can_be_read\":true,\"b
