<!DOCTYPE html><html lang="ru"><head><title>Мастер и Маргарита</title></head><body><script>self.__next_f.push([1,"30:Tf7,{\"type\":\"next\",\"value\":{\"data\":{\"audioBook\":{\"book\":{\"initUuid\":\"VTVT8GzC\",\"relations\":{\"inSeries\":{\"cursor\":\"\",\"page\":[],\"__typename\":\"BookSeriesItems\"},\"__typename\":\"Relations\"},\"__typename\":\"Book\"},\"__typename\":\"AudioBook\"}}},\"id\":\"fixture-48\"}31:T14,{\"type\":\"completed\"}31:C\n32:T4cbb,{\"type\":\"next\",\"value\":{\"data\":{\"oldAudioBook\":{\"audiobook\":{\"uuid\":\"VTVT8GzC\",\"init_uuid\":\"VTVT8GzC\",\"title\":\"Мастер и Маргарита\",\"annotation\":\"Победитель премии «Книга года» в номинации «Электронные издания и аудиокниги» на ММКЯ 2022!\\r\\n\\r\\nАудио Издательство ВИМБО предлагает вашему вниманию первый и небывало масштабный аудиоспектакль по культовому роману Михаила Булгакова «Мастер и Маргарита», исполненный целым созвездием блестящих актеров. У каждой роли – свой неповторимый голос, и их тонко срежиссированное многозвучие запускает в воображении слушателя настоящее кино. Окружённый мистическим ореолом «роман о дьяволе» запрещали, подвергали цензуре, им зачитывались подпольно в самиздате, а в наше время изучают в школе и университетах. О чем «Мастер и Маргарита» может прозвучать сегодня? О непримиримых противоречиях истинного творца с тем обществом, которое его окружает. О том, как тонка граница между добром и злом – настолько тонка, что различить ее бывает трудно. Аудиоспектакль воспроизводит полный текст романа в последней редакции Елены Булгаковой без каких-либо сокращений и изменений.\\r\\n\\r\\n«Прежде всего, меня интересовала идея любви и смерти, которые рядом – всегда рядом. Любви и творчества, любви мужчины к женщине, женщины к мужчине, любви одного человека к человечеству вообще – на примере Иешуа Га-Ноцри. Этот роман пронизан любовью насквозь» Алексей Багдасаров, режиссер и исполнитель роли Автора.\\r\\n\\r\\n«Роман «Мастер и Маргарита» уникален: своей структурой, сопряжением разных жанров, стилей и вневременных смыслов. Исполненный ансамблем талантливейших актёров, подобно волшебному крему Маргариты, он дарит чувство полета» Мария Родионова, автор сценария и помощник режиссера.\\r\\n\\r\\nПобедитель национального конкурса «Книга года» в номинации «Электронные издания и аудиокниги».\\r\\n\\r\\nВ ролях:\\r\\n\\r\\nАвтор – Алексей Багдасаров\\r\\nМастер – Кирилл Пирогов\\r\\nМаргарита – Ксения Раппопорт\\r\\nВоланд – Максим Суханов\\r\\nКоровьев – Анатолий Белый\\r\\nКот – Виктор Сухоруков\\r\\nАзазелло – Игорь Яцко\\r\\nГелла – Елизавета Боярская\\r\\nБездомный Иван Николаевич – Антон Шагин\\r\\nБерлиоз Михаил Александрович – Алексей Дубровский\\r\\nСтравинский Александр Николаевич – Григорий Перель\\r\\nПоплавский Максимилиан Андреевич – Алексей Кортнев\\r\\nСоков Андрей Фокич, Фока – Ефим Шифрин\\r\\nРюхин Александр, Кузьмин – Сергей Чурбаков\\r\\nЛиходеев Степан Богданович, Левий Матвей – Александр Усов\\r\\nБосой Никанор Иванович, Арчибальд, Ведущий следствие – Иван Литвинов\\r\\nРимский Григорий Данилович – Артем Смола\\r\\nВаренуха Иван Савельевич – Григорий Данцигер\\r\\nЖорж Бенгальский, Толстяк – Кирилл Радциг\\r\\nКсения Никитишна, Фрида – Анна Каменкова\\r\\nСемплеяров Аркадий Аполлонович, Амвросий, Артист Куролесов Савва Потапович – Владимир Левашев\\r\\nЖена Семплеярова, Тофана – Надежда Меньшова\\r\\nАннушка, Пелагея Антоновна, Кондукторша – Ольга Лапшина\\r\\nПокобатько Милица Андреевна, Востроносая женщина, Продавщица – Марина Дианова\\r\\nЛасточкин Василий Степанович, Доктор, Алоизий Могарыч – Сергей Аронин\\r\\nНаташа – Анастасия Имамова\\r\\nКонферансье – Тимур Бадалбейли\\r\\nПрохор Петрович, Палосич – Николай Лукинский\\r\\nМальчик, Анна Ричардовна, Моющаяся – Ольга Шорохова\\r\\nНиколай Иванович (Боров), Швейцар, Иностранец – Александр Жуков\\r\\nПрасковья Федоровна – Наталия Казначеева\\r\\nЖак, Следователь, Продавец, Первый в косоворотке, Шофер – Алексей Баранов\\r\\nСофья Павловна, Супруга Жака – Мария Орлова\\r\\nДевица – Мария Лапшина\\r\\nДунчиль, Мужские голоса – Илья Сланевский\\r\\nПочтальонша – Юлия Яблонская\\r\\nКанавкин Николай, Следователь – Вячеслав Скибюк\\r\\n\\r\\nАвтор сценария: Мария Родионова\\r\\nРежиссёр: Алексей Багдасаров\\r\\nКомпозитор: Владимир Брусс\\r\\nДизайн и иллюстрации: Юлия Стоцкая\\r\\n\\r\\n© М.А.Булгаков (наследники)\\r\\nЗапись произведена Аудио Издательством ВИМБО\\r\\n©&℗ ООО «Вимбо», 2022\\r\\nПродюсеры: Вадим Бух, Михаил Литваков\",\"editor_annotation\":\"Булгакову — 135! Слушаем звёздный аудиоспектакль по знаменитому роману\",\"linked_book_uuids\":[\"MWxAop5b\"],\"bookshelf_id\":null,\"age_restriction\":null,\"owner_catalog_title\":\"Вимбо\",\"background_color_hex\":\"#D37B31\",\"listeners_count\":831967,\"impressions_count\":6053,\"bookshelves_count\":337,\"duration\":64914,\"publication_date\":1669064400,\"can_be_listened\":true,\"language\":\"ru\",\"access_restrictions\":[],\"cover\":{\"small\":\"https://api.bookmate.ru/assets/audiobooks-covers/ad/08/VTVT8GzC-small.jpeg?image_hash=0254f50dfcfea918780cffd732641c4a\",\"large\":\"https://api.bookmate.ru/assets/audiobooks-covers/ad/08/VTVT8GzC-large.jpeg?image_hash=0d54657369b4d037ce3ddda83853b7fb\",\"ratio\":1,\"placeholder\":\"iVBORw0KGgoAAAANSUhEUgAAAAQAAAAEBAMAAABb34NNAAAAMFBMVEVAKBlHMiNPMh9QJxO+jl+1hlnNo2/Jm2Ope1OtflelflmhhV+0jGW1jGemgF2HbFHjqrYsAAAAFElEQVQI12NgVGZwTWfoXM1w9j0ADlADwdHmvQEAAAAASUVORK5CYII=\",\"background_color_hex\":\"#D37B31\",\"__typename\":\"ImagePayload\"},\"audio_card\":null,\"authors\":[{\"uuid\":\"uQY0rPfw\",\"name\":\"Михаил Булгаков\",\"locale\":\"ru\",\"about\":null,\"died_at\":null,\"born_at\":null,\"removed\":false,\"works_count\":1046,\"image\":{\"small\":\"https://api.bookmate.ru/assets/meta_authors-images/9e/6a/cache-85b4f0b239da3015e79680e92250d55f.jpg\",\"large\":\"https://api.bookmate.ru/assets/meta_authors-images/9e/6a/cache-85b4f0b239da3015e79680e92250d55f.jpg\",\"ratio\":null,\"placeholder\":\"iVBORw0KGgoAAAANSUhEUgAAAAQAAAAEBAMAAABb34NNAAA
