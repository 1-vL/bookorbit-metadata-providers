<!DOCTYPE html><html lang="ru"><head><title>Лавр</title></head><body><script>self.__next_f.push([1,"30:T1c2f,{\"type\":\"next\",\"value\":{\"data\":{\"oldBook\":{\"book\":{\"linked_audiobook_uuids\":[],\"editor_annotation\":\"Как талантливый врач превратился в юродивого? Роман, ставший современной классикой\",\"annotation\":\"Первое издание культового романа, полюбившегося сотням тысяч россиян. Евгений Водолазкин рассказал историю средневекового врача так, что она нашла отклик в сердцах и умах многих читателей.\\r\\n\\r\\n«Лавр» стал настоящей литературной сенсацией. Роман удостоен премий «Большая книга» и «Ясная Поляна», переведен на 30 языков и уверенно держится в бестселлерах уже много лет.\\r\\nКритики отмечают блестящий стиль писателя и высокий уровень литературного мастерства, «Лавру» посвящены серьезные филологические исследования.\\r\\n\\r\\nЕвгений Водолазкин — автор романа «Соловьев и Ларионов» (финалист «Большой книги» и Премии Андрея Белого), сборника эссе «Инструмент языка» и других книг. \\r\\nФилолог, специалист по древнерусской литературе, он не любит исторических романов, «их навязчивого этнографизма — кокошников, повойников, портов, зипунов» и прочую унылую стилизацию. Используя интонации древнерусских текстов, Водолазкин причудливо смешивает разные эпохи и языковые стихии, даря читателю не гербарий, но живой букет. \\r\\n\\r\\nГерой нового романа «Лавр» — средневековый врач. Обладая даром исцеления, он тем не менее не может спасти свою возлюбленную и принимает решение пройти земной путь вместо нее. Так жизнь превращается в житие. Он выхаживает чумных и раненых, убогих и немощных, и чем больше жертвует собой, тем очевиднее крепнет его дар. Но возможно ли любовью и жертвой спасти душу человека, не сумев уберечь ее земной оболочки?\\r\\n\\r\\n«Есть то, о чем легче говорить в древнерусском контексте. Например, о Боге. Мне кажется, связи с Ним раньше были прямее. Важно уже то, что они просто были. Сейчас вопрос этих связей занимает немногих, что озадачивает. Неужели со времен Средневековья мы узнали что-то радикально новое, что позволяет расслабиться?» — Евгений Водолазкин\",\"authors\":\"Евгений Водолазкин\",\"language\":\"ru\",\"paper_pages\":312,\"restricted_reading_on_web\":false,\"title\":\"Лавр\",\"uuid\":\"MJwmY8DF\",\"init_uuid\":\"MJwmY8DF\",\"type\":\"book\",\"source_type\":\"html\",\"publication_date\":1727730000,\"owner_catalog_title\":\"АСТ\",\"original_year\":null,\"is_uploaded\":false,\"episodes_count\":null,\"bookshelves_count\":86,\"impressions_count\":911,\"quotes_count\":10787,\"readers_count\":24302,\"can_be_read\":true,\"bookshelf_id\":null,\"age_restriction\":null,\"in_library\":false,\"in_wishlist\":false,\"position\":null,\"access_restrictions\":[],\"cover\":{\"small\":\"https://api.bookmate.ru/assets/books-covers/f5/41/MJwmY8DF-thumb.jpeg?image_hash=53121f8e4eb9d85096f090b9d46c1cd2\",\"large\":\"https://api.bookmate.ru/assets/books-covers/f5/41/MJwmY8DF-ipad.jpeg?image_hash=9450b0578fcb034c478c17159d6f17de\",\"ratio\":0.645,\"placeholder\":\"iVBORw0KGgoAAAANSUhEUgAAAAQAAAAEBAMAAABb34NNAAAAJ1BMVEXf3+HAv8OfoJ2hpJrl6dqgq4BdaTU3Qg/x8+zS2MCrtYlsdE7///+G2BExAAAAFElEQVQI12NgVGZwTWfoXM1w5gwADisDnUNnb6kAAAAASUVORK5CYII=\",\"background_color_hex\":\"#A5AD8C\",\"__typename\":\"ImagePayload\"},\"authors_objects\":[{\"uuid\":\"gO0ZiQHc\",\"name\":\"Евгений Водолазкин\",\"locale\":\"ru\",\"about\":null,\"died_at\":null,\"born_at\":null,\"removed\":false,\"works_count\":157,\"__typename\":\"ContentAuthorPayload\"}],\"library_card\":null,\"topics\":[{\"uuid\":\"FfOk0zYn\",\"slug\":\"sovremennaya-literatura\",\"title\":\"Современная литература\",\"parent_slug\":\"proza-ru\",\"icon\":\"\",\"is_subtopic\":true,\"language\":\"ru\",\"__typename\":\"TopicPayload\"},{\"uuid\":\"UGLwrSvm\",\"slug\":\"russkaya-literatura\",\"title\":\"Русская литература\",\"parent_slug\":\"proza-ru\",\"icon\":\"\",\"is_subtopic\":true,\"language\":\"ru\",\"__typename\":\"TopicPayload\"},{\"uuid\":\"TvoN1TQU\",\"slug\":\"psihologi
