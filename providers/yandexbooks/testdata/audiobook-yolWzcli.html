<!DOCTYPE html><html lang="ru"><head><title>Ночной дозор</title></head><body><script>self.__next_f.push([1,"30:T255d,{\"type\":\"next\",\"value\":{\"data\":{\"oldAudioBook\":{\"audiobook\":{\"uuid\":\"yolWzcli\",\"init_uuid\":\"yolWzcli\",\"title\":\"Ночной дозор\",\"annotation\":\"Пять лет назад Антон Городецкий узнал, что он – светлый Иной. То есть может входить в Сумрак и делать то, что обычные люди считают волшебством. Антон решил работать в Ночном Дозоре, чтобы сохранять баланс сил между Светом и Тьмой – оборотнями, вампирами, ведьмами.\\r\\n\\r\\nНо поскольку Городецкий засиделся в аналитическом отделе, Борис Гесер, руководитель московского отделения Дозоров, отправляет мужчину в поле – на охоту за вампиром-маньяком.\\r\\n\\r\\nИ тут начинает твориться что-то невероятное… Выслеживая мальчика, на которого направлен вампирский Зов, Антон встречает в метро девушку с черной воронкой проклятия невероятного масштаба. Городецкий должен бы проследить за девушкой, но он наконец-то обнаруживает мальчика, которого так долго искал. И отправляется за ним, чтобы спасти от вампиров…\\r\\n\\r\\nОхота заканчивается не так, как планировалось. А вскоре Антон узнает: воронка над девушкой может уничтожить Москву. Чтобы не допустить прорыв инферно, Иным надо как можно быстрее выяснить, кто же наложил проклятие такой мощности. А тем временем неупокоенная вампирша продолжает охотиться на спасенного мальчика, который может стать Великим Иным…\",\"editor_annotation\":\"И треснул мир напополам: первый роман серии о противостоянии светлых и тёмных Иных\",\"linked_book_uuids\":[\"FVvJyn5e\"],\"bookshelf_id\":null,\"age_restriction\":null,\"owner_catalog_title\":\"АСТ\",\"background_color_hex\":\"#B07838\",\"listeners_count\":93546,\"impressions_count\":2018,\"bookshelves_count\":63,\"duration\":62155,\"publication_date\":1669064400,\"can_be_listened\":true,\"language\":\"ru\",\"access_restrictions\":[],\"cover\":{\"small\":\"https://api.bookmate.ru/assets/audiobooks-covers/ee/49/yolWzcli-
