<!DOCTYPE html><html lang="ru"><head><title>Мастер и Маргарита. Графический роман</title></head><body><script>self.__next_f.push([1,"30:Tf7,{\"type\":\"next\",\"value\":{\"data\":{\"comicBook\":{\"book\":{\"initUuid\":\"yjrd9dHo\",\"relations\":{\"inSeries\":{\"cursor\":\"\",\"page\":[],\"__typename\":\"BookSeriesItems\"},\"__typename\":\"Relations\"},\"__typename\":\"Book\"},\"__typename\":\"ComicBook\"}}},\"id\":\"fixture-48\"}31:T14,{\"type\":\"completed\"}31:C\n32:T11a8,{\"type\":\"next\",\"value\":{\"data\":{\"oldComicBook\":{\"comicbook\":{\"editor_annotation\":null,\"annotation\":\"Дьявол прибыл в Москву, чтобы устроить самый грандиозный бал в истории. Но это не просто визит тьмы — это зеркало, в котором советская столица увидит свои истинные пороки. Москва, 1930-е годы. И именно сюда, в самое сердце новой реальности, ступает Воланд со своей бессмертной свитой — мрачным Коровьевым, дерзким котом Бегемотом и смертоносным Азазелло. Смех, магия и справедливость, которую не может вершить ни один суд, врываются в московские переулки, заставляя горожан платить по счетам. В этом безумном водовороте теряют голову литераторы, рушатся театральные подмостки, а на Патриарших прудах случайный прохожий теряет не только шляпу, но и рассудок. Но среди хаоса и чертовщины есть два луча света. Это Мастер — гений, сожженный страхом и системой, написавший роман о Понтии Пилате. И Маргарита — женщина, чья любовь сильнее страха смерти и проклятия. Ради встречи с ним она согласится стать ведьмой, разгромить дом критика и танцевать на балу среди величайших грешников истории. Графический роман «Мастер и Маргарита» — это не просто адаптация великого текста. Это кинематографичное, мрачное и чувственное путешествие по страницам булгаковского шедевра. Впервые сатира, трагедия, мистика и всепоглощающая нежность сливаются в таком ярком, дерзком и визуально мощном прочтении.\",\"language\":\"ru\",\"title\":\"Мастер и Маргарита. Графический роман\",\"uuid\":\"yjrd9dHo\",\"init_uuid\":\"yjrd9d
